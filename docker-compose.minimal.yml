services:
  # Main API Service
  api:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: transcription-api
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - STORAGE_TYPE=sqlite
      - SQLITE_DB_PATH=/app/storage/database.db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health', timeout=5)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.4'

  # Video Processing Worker (Single Worker)
  video-worker:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: video-worker
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - STORAGE_TYPE=sqlite
      - SQLITE_DB_PATH=/app/storage/database.db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
      - WORKER_THREADS=1
      - MAX_CONCURRENT_TASKS=1
    depends_on:
      - rabbitmq
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 120s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.2'

  # RabbitMQ สำหรับ message queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: transcription-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
      - RABBITMQ_VM_MEMORY_HIGH_WATERMARK=0.3
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 60s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: '0.1'

  # Redis สำหรับ caching และ queue
  redis:
    image: redis:7-alpine
    container_name: transcription-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 80M
          cpus: '0.1'

  # Whisper.cpp สำหรับ transcription
  whisper:
    image: kksenateacr.azurecr.io/kk-transcription-whisper:alpha-dev
    container_name: transcription-whisper
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - WHISPER_MODEL_PATH=/app/models
      - ENVIRONMENT=production
      - WHISPER_THREADS=1
      - WHISPER_BATCH_SIZE=8
      - WHISPER_OPTIMIZE=true
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health', timeout=5)"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

volumes:
  redis_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
