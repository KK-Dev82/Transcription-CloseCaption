# Docker Compose สำหรับ Local Testing แบบ Direct Mode
# ใช้แนวทางเดียวกับ RunPod: Build Container → Clone Git → Start services แบบ Direct mode
# ไม่ใช้ CUDA (สำหรับ MacOS และ Linux ที่ไม่มี GPU)

# version: '3.8'  # Obsolete in newer Docker Compose versions

services:
  # Base Container สำหรับ Direct Mode Testing
  transcription-base:
    build:
      context: .
      dockerfile: Dockerfile.local-base
    image: kk-transcription-local-base:latest
    container_name: transcription-local-base
    volumes:
      # Mount project directory เพื่อให้ clone repo ได้
      - ./:/workspace/transcription-service
      # Mount storage และ uploads
      - ./storage:/workspace/transcription-service/storage
      - ./uploads:/workspace/transcription-service/uploads
      - ./temp:/workspace/transcription-service/temp
      - ./models:/workspace/transcription-service/models
    ports:
      - "8001:8001"  # Main API
      - "8002:8002"  # Whisper API
      # Redis ไม่ต้อง expose เพราะรันภายใน container และ services เชื่อมต่อผ่าน localhost:6379
    environment:
      - PYTHONPATH=/workspace/transcription-service
      - ENVIRONMENT=local
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/workspace/transcription-service/storage
      - RABBITMQ_HOST=host.docker.internal
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=senate
      - RABBITMQ_PASSWORD=qP2VtHz6fAX4xDksEpMrLT
      - REDIS_URL=redis://localhost:6379
      - WHISPER_PROVIDER=openai-whisper
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=auto
      - TZ=Asia/Bangkok
      - TZDIR=/usr/share/zoneinfo
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    command: /bin/bash -c "cd /workspace/transcription-service && exec /bin/bash"
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

