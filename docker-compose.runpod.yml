# Docker Compose สำหรับ RunPod GPU Instance
# ใช้สำหรับทดสอบ transcription บน GPU Cloud (RTX 4070/4080/4090)
#
# ⚠️ สำคัญ: RunPod อยู่นอกวง VPN
#
# เงื่อนไข:
# 1. Pod GPU ต้องเชื่อมต่อกับ RabbitMQ ที่ MacOS Localhost (ใช้ SSH Tunnel)
# 2. Backend ต้องเชื่อมต่อกับ Pod Server ได้ (ส่ง File URL ให้ Download)
# 3. Environment สำหรับทดลองก่อนไปใช้ Z2 Workstation Linux
# 4. Pod ใช้ Docker Container และ pull image (เหมือน staging) - ไม่ build
# 5. Redis แยกจาก backend (เหมือน staging/local) เพื่อลด dependency และ network latency
#
# Flow:
# 1. Backend → ส่ง File URL ไปให้ Transcription Service (RunPod)
# 2. Transcription Service → Download file จาก FileService URL
# 3. Transcription Service → ติดต่อ RabbitMQ (ผ่าน SSH Tunnel) เพื่อรับ task
# 4. Transcription Service → Process และส่งผลลัพธ์กลับไป Backend
#
# การใช้งาน:
# 1. สร้าง RunPod Pod (GPU Template: PyTorch 2.2.0 หรือ 2.4.0)
# 2. ตั้งค่า SSH Tunnel สำหรับ RabbitMQ (ดู LOCAL_TESTING.md)
#    - Redis ไม่ต้องใช้ SSH Tunnel (มี container เอง)
# 3. Clone repository ไปที่ /workspace
# 4. สร้าง .env.runpod และตั้งค่า RABBITMQ_HOST=localhost, REDIS_URL=redis://redis:6379
# 5. รัน: docker compose -f docker-compose.runpod.yml --env-file .env.runpod up -d

version: '3.8'

services:
  # Main API Service
  # ใช้ pull image จาก ACR (เหมือน staging) - ไม่ build
  # ⚠️ ต้อง login ACR ก่อน: az acr login --name kksenateacr
  api:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    platform: linux/amd64
    container_name: transcription-api-runpod
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
      - ./test-files:/app/test-files
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=runpod
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      # RabbitMQ - ใช้ localhost (ผ่าน SSH Tunnel จาก MacOS)
      # ⚠️ ต้องตั้งค่า SSH Tunnel ก่อน: ssh -L 5672:localhost:5672 user@runpod-ip -N
      - RABBITMQ_HOST=${RABBITMQ_HOST:-localhost}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-senate}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-qP2VtHz6fAX4xDksEpMrLT}
      # Whisper API - ใช้ GPU instance (local container)
      - WHISPER_API_URL=http://whisper:8002
      # Redis - ใช้ local container (เหมือน staging/local)
      # ⚠️ แยกจาก backend เพื่อลด dependency และ network latency
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Provider Configuration
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-builtin}
      - WHISPER_FALLBACK_ENABLED=${WHISPER_FALLBACK_ENABLED:-false}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    networks:
      - runpod-network
    restart: unless-stopped
    depends_on:
      - redis
    # ไม่ต้องใช้ extra_hosts เพราะใช้ SSH Tunnel (localhost)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'

  # Video Processing Worker
  # ใช้ pull image จาก ACR (เหมือน staging) - ไม่ build
  # ⚠️ ต้อง login ACR ก่อน: az acr login --name kksenateacr
  video-worker:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    platform: linux/amd64
    container_name: transcription-video-worker-runpod
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=runpod
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      # RabbitMQ - ใช้ localhost (ผ่าน SSH Tunnel จาก MacOS)
      - RABBITMQ_HOST=${RABBITMQ_HOST:-localhost}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER:-senate}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-qP2VtHz6fAX4xDksEpMrLT}
      - WHISPER_API_URL=http://whisper:8002
      # Redis - ใช้ localhost (ผ่าน SSH Tunnel จาก MacOS)
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379}
    networks:
      - runpod-network
    restart: unless-stopped
    depends_on:
      - redis
    # ไม่ต้องใช้ extra_hosts เพราะใช้ SSH Tunnel (localhost)
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'
    depends_on:
      - whisper

  # Whisper.cpp Service with GPU Support (CUDA)
  # ⚠️ ต้อง build จาก Dockerfile.gpu (ACR ไม่มี GPU image)
  # สำหรับ Local Testing: build บน Pod
  whisper:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile.gpu
    image: kk-transcription-whisper:runpod-gpu
    container_name: transcription-whisper-runpod
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - WHISPER_MODEL_PATH=/app/models
      - ENVIRONMENT=runpod
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - WHISPER_CUBLAS=1
    networks:
      - runpod-network
    restart: unless-stopped
    # GPU Support - ใช้ nvidia runtime
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
        limits:
          memory: 16G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis สำหรับ caching และ queue (เหมือน staging/local)
  # ⚠️ แยกจาก backend เพื่อลด dependency และ network latency
  redis:
    image: redis:7-alpine
    container_name: transcription-redis-runpod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_runpod:/data
    networks:
      - runpod-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis_data_runpod:

networks:
  runpod-network:
    driver: bridge
