<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .processing { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>🧪 WebSocket Test</h1>
    <div id="status" class="status disconnected">🔴 Disconnected</div>
    <div id="logs"></div>
    
    <script>
        const statusEl = document.getElementById('status');
        const logsEl = document.getElementById('logs');
        const taskId = '86b8d79b-7271-4048-b984-1142c3699c73';
        const userId = 'test_user_' + Math.random().toString(36).substr(2, 9);
        
        function log(message) {
            const logEl = document.createElement('div');
            logEl.className = 'log';
            logEl.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
            logsEl.appendChild(logEl);
            logsEl.scrollTop = logsEl.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(message, className) {
            statusEl.textContent = message;
            statusEl.className = `status ${className}`;
        }
        
        // WebSocket URL
        const wsUrl = `wss://staging-ph2.bms.senate.go.th/transcribe/ws/transcription/${userId}`;
        log(`Connecting to: ${wsUrl}`);
        
        const ws = new WebSocket(wsUrl);
        
        ws.onopen = () => {
            log('✅ WebSocket Connected!');
            updateStatus('🟢 Connected', 'connected');
            
            // Subscribe to task
            ws.send(JSON.stringify({
                type: 'subscribe',
                task_id: taskId
            }));
            log(`📝 Subscribed to task: ${taskId}`);
        };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            log(`📨 Received: ${JSON.stringify(data, null, 2)}`);
            
            if (data.type === 'ping') {
                ws.send(JSON.stringify({
                    type: 'pong',
                    timestamp: data.timestamp
                }));
                log('🏓 Sent pong response');
            }
            
            if (data.task_id === taskId) {
                if (data.status === 'completed') {
                    updateStatus('✅ Task Completed!', 'connected');
                } else if (data.status === 'failed') {
                    updateStatus('❌ Task Failed', 'disconnected');
                } else if (data.status === 'processing') {
                    updateStatus(`⏳ Processing... ${data.progress || 0}%`, 'processing');
                }
            }
        };
        
        ws.onclose = (event) => {
            log(`🔴 WebSocket Closed: ${event.code} - ${event.reason}`);
            updateStatus('🔴 Disconnected', 'disconnected');
        };
        
        ws.onerror = (error) => {
            log(`❌ WebSocket Error: ${error}`);
            updateStatus('❌ Error', 'disconnected');
        };
        
        // Test polling as fallback
        setInterval(async () => {
            try {
                const response = await fetch(`https://staging-ph2.bms.senate.go.th/transcribe/polling/task/${taskId}`, {
                    mode: 'cors'
                });
                const data = await response.json();
                log(`🔄 Polling: ${data.status} - ${data.progress || 0}%`);
                
                if (data.status === 'completed') {
                    updateStatus('✅ Task Completed!', 'connected');
                } else if (data.status === 'failed') {
                    updateStatus('❌ Task Failed', 'disconnected');
                }
            } catch (error) {
                log(`❌ Polling failed: ${error.message}`);
            }
        }, 5000);
    </script>
</body>
</html>
