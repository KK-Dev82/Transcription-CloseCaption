services:
  # Main API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    image: kk-transcription:local-dev
    container_name: transcription-api-local
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
      - ./test-files:/app/test-files
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=local
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=senate
      - RABBITMQ_PASSWORD=qP2VtHz6fAX4xDksEpMrLT
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network
      - senate-backend_kk-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'

  # Video Processing Worker 1
  video-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    image: kk-transcription:local-dev
    container_name: video-worker-1-local
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=local
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=senate
      - RABBITMQ_PASSWORD=qP2VtHz6fAX4xDksEpMrLT
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network
      - senate-backend_kk-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Video Processing Worker 2
  video-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    image: kk-transcription:local-dev
    container_name: video-worker-2-local
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=local
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=senate
      - RABBITMQ_PASSWORD=qP2VtHz6fAX4xDksEpMrLT
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network
      - senate-backend_kk-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Video Processing Worker 3
  video-worker-3:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    image: kk-transcription:local-dev
    container_name: video-worker-3-local
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=local
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=senate
      - RABBITMQ_PASSWORD=qP2VtHz6fAX4xDksEpMrLT
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network
      - senate-backend_kk-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '0.5'

  # RabbitMQ ย้ายไป Backend API แล้ว

  # Redis สำหรับ caching และ queue
  redis:
    image: redis:7-alpine
    container_name: transcription-redis-local
    ports:
      - "6380:6379"
    volumes:
      - redis_data_local:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.5'

  # Whisper.cpp สำหรับ transcription (Local)
  whisper:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile.arm64
    image: kk-transcription-whisper:local-dev
    container_name: transcription-whisper-local
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - WHISPER_MODEL_PATH=/app/models
      - ENVIRONMENT=local
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'

  # Whisper สำหรับ Live Streaming
  whisper-live:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile.arm64
    image: kk-transcription-whisper:local-dev
    container_name: transcription-whisper-live-local
    ports:
      - "8003:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - WHISPER_MODEL_PATH=/app/models
      - ENVIRONMENT=local
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '1.0'

volumes:
  redis_data_local:

networks:
  app-network:
    driver: bridge
  senate-backend_kk-network:
    external: true
