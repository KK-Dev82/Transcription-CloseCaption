name: Build and Deploy to Azure Container Registry

on:
  push:
    branches:
      - staging
      - "staging/**"
  workflow_dispatch: # ให้รันได้ด้วยมือ

env:
  IMAGE_NAME: kk-transcription
  WHISPER_IMAGE_NAME: kk-transcription-whisper
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}.azurecr.io
  VERSION: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata for main app
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest

      - name: Extract metadata for whisper service
        id: meta-whisper
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WHISPER_IMAGE_NAME }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.WHISPER_IMAGE_NAME }}:staging-latest

      - name: Build and push main application
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push whisper service
        uses: docker/build-push-action@v5
        with:
          context: ./whisper-service
          file: ./whisper-service/Dockerfile
          push: true
          tags: ${{ steps.meta-whisper.outputs.tags }}
          labels: ${{ steps.meta-whisper.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update docker-compose.staging.yml with image tags
        run: |
          # สร้าง staging compose file ที่ใช้ ACR images
          cat > docker-compose.staging.acr.yml << EOF
          services:
            api:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
              container_name: transcription-api-staging
              ports:
                - "8001:8001"
              volumes:
                - ./uploads:/app/uploads
                - ./storage:/app/storage
                - ./temp:/app/temp
                - ./models:/app/models
              environment:
                - PYTHONPATH=/app
                - ENVIRONMENT=staging
                - STORAGE_TYPE=sqlite
                - SQLITE_DB_PATH=/app/storage/database.db
                - RABBITMQ_HOST=rabbitmq
                - RABBITMQ_PORT=5672
                - RABBITMQ_USER=admin
                - RABBITMQ_PASSWORD=admin123
              depends_on:
                - redis
                - rabbitmq
              networks:
                - app-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s
              deploy:
                resources:
                  limits:
                    memory: 6G
                    cpus: '3.0'

            whisper:
              image: ${{ env.REGISTRY }}/${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }}
              container_name: transcription-whisper-staging
              ports:
                - "8002:8002"
              volumes:
                - ./uploads:/app/audio
                - ./temp:/app/temp
                - ./models:/app/models
              environment:
                - WHISPER_MODEL_PATH=/app/models
                - ENVIRONMENT=staging
              networks:
                - app-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s
              deploy:
                resources:
                  limits:
                    memory: 8G
                    cpus: '6.0'

            # เพิ่ม services อื่นๆ ตามต้องการ
            rabbitmq:
              image: rabbitmq:3-management-alpine
              container_name: transcription-rabbitmq-staging
              ports:
                - "5672:5672"
                - "15672:15672"
              environment:
                - RABBITMQ_DEFAULT_USER=admin
                - RABBITMQ_DEFAULT_PASS=admin123
              volumes:
                - rabbitmq_data_staging:/var/lib/rabbitmq
              networks:
                - app-network
              restart: unless-stopped

            redis:
              image: redis:7-alpine
              container_name: transcription-redis-staging
              ports:
                - "6379:6379"
              volumes:
                - redis_data_staging:/data
              networks:
                - app-network
              restart: unless-stopped
              command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru

          volumes:
            redis_data_staging:
            rabbitmq_data_staging:

          networks:
            app-network:
              driver: bridge
          EOF

      - name: Upload staging compose file
        uses: actions/upload-artifact@v3
        with:
          name: docker-compose-staging-acr
          path: docker-compose.staging.acr.yml

      - name: Output image info
        run: |
          echo "✅ Images built and pushed successfully!"
          echo "Main App Tags: ${{ steps.meta-main.outputs.tags }}"
          echo "Whisper Tags: ${{ steps.meta-whisper.outputs.tags }}"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Staging Compose File: docker-compose.staging.acr.yml"
