name: Build and Deploy to Azure Container Registry

on:
  push:
    branches:
      # - staging
      # - "staging/**"
      - no-build
  workflow_dispatch: # ให้รันได้ด้วยมือ

env:
  IMAGE_NAME: kk-transcription
  WHISPER_IMAGE_NAME: kk-transcription-whisper
  REGISTRY: kksenateacr.azurecr.io
  VERSION: alpha-dev

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      main-image: ${{ steps.save-main.outputs.imageid }}
      whisper-image: ${{ steps.save-whisper.outputs.imageid }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build main application
        id: build-main
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker

      - name: Build whisper service
        id: build-whisper
        uses: docker/build-push-action@v5
        with:
          context: ./whisper-service
          file: ./whisper-service/Dockerfile
          push: false
          tags: ${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker

      - name: Save main image
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.VERSION }} | gzip > main-image.tar.gz

      - name: Save whisper image
        run: |
          docker save ${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }} | gzip > whisper-image.tar.gz

      - name: Upload main image
        uses: actions/upload-artifact@v4
        with:
          name: main-image
          path: main-image.tar.gz
          retention-days: 0

      - name: Upload whisper image
        uses: actions/upload-artifact@v4
        with:
          name: whisper-image
          path: whisper-image.tar.gz
          retention-days: 0

      - name: Save image info
        id: save-main
        run: |
          echo "imageid=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}" >> $GITHUB_OUTPUT

      - name: Save whisper info
        id: save-whisper
        run: |
          echo "imageid=${{ env.REGISTRY }}/${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }}" >> $GITHUB_OUTPUT

      - name: Copy docker-compose.yml for staging
        run: |
          cp docker-compose.yml docker-compose.staging.yml
          echo "✅ Using existing docker-compose.yml for staging"

      - name: Output build info
        run: |
          echo "✅ Images built successfully!"
          echo "Main App: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
          echo "Whisper: ${{ env.REGISTRY }}/${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }}"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Staging Compose File: docker-compose.staging.yml"

  push:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download main image
        uses: actions/download-artifact@v4
        with:
          name: main-image
          path: ./

      - name: Download whisper image
        uses: actions/download-artifact@v4
        with:
          name: whisper-image
          path: ./

      - name: Load main image
        run: |
          gunzip -c main-image.tar.gz | docker load
          docker tag ${{ env.IMAGE_NAME }}:${{ env.VERSION }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Load whisper image
        run: |
          gunzip -c whisper-image.tar.gz | docker load
          docker tag ${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }} ${{ env.REGISTRY }}/${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push main application
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Push whisper service
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }}

      - name: Output push info
        run: |
          echo "✅ Images pushed successfully!"
          echo "Main App Tags:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
          echo "Whisper Tags:"
          echo "  - ${{ env.REGISTRY }}/${{ env.WHISPER_IMAGE_NAME }}:${{ env.VERSION }}"
          echo "Registry: ${{ env.REGISTRY }}"
