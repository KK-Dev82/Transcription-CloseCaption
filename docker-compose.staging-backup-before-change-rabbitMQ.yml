services:
  # Main API Service
  api:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: transcription-api-staging
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=staging
      - STORAGE_TYPE=sqlite
      - SQLITE_DB_PATH=/app/storage/database.db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    # user: "1001:1001"  # ใช้ user ID เดียวกันกับ host (kscdev) - เอาออกเพราะ container ไม่มี user 1001
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'

  # Video Processing Worker 1
  video-worker-1:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: video-worker-1-staging
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=staging
      - STORAGE_TYPE=sqlite
      - SQLITE_DB_PATH=/app/storage/database.db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    # user: "1001:1001"  # ใช้ user ID เดียวกันกับ host (kscdev) - เอาออกเพราะ container ไม่มี user 1001
    depends_on:
      - rabbitmq
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Video Processing Worker 2
  video-worker-2:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: video-worker-2-staging
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=staging
      - STORAGE_TYPE=sqlite
      - SQLITE_DB_PATH=/app/storage/database.db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    # user: "1001:1001"  # ใช้ user ID เดียวกันกับ host (kscdev) - เอาออกเพราะ container ไม่มี user 1001
    depends_on:
      - rabbitmq
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Video Processing Worker 3
  video-worker-3:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: video-worker-3-staging
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=staging
      - STORAGE_TYPE=sqlite
      - SQLITE_DB_PATH=/app/storage/database.db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
      - WORKER_THREADS=2
      - MAX_CONCURRENT_TASKS=3
      - OPTIMIZE_PERFORMANCE=true
    # user: "1001:1001"  # ใช้ user ID เดียวกันกับ host (kscdev) - เอาออกเพราะ container ไม่มี user 1001
    depends_on:
      - rabbitmq
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '1.0'

  # RabbitMQ สำหรับ message queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: transcription-rabbitmq-staging
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    volumes:
      - rabbitmq_data_staging:/var/lib/rabbitmq
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Redis สำหรับ caching และ queue
  redis:
    image: redis:7
    container_name: transcription-redis-staging
    ports:
      - "6379:6379"
    volumes:
      - redis_data_staging:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.5'

  # Whisper.cpp สำหรับ transcription (Staging)
  whisper:
    image: kksenateacr.azurecr.io/kk-transcription-whisper:alpha-dev
    container_name: transcription-whisper-staging
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - WHISPER_MODEL_PATH=/app/models
      - ENVIRONMENT=staging
      - WHISPER_THREADS=4
      - WHISPER_BATCH_SIZE=32
      - WHISPER_OPTIMIZE=true
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'

  # Whisper สำหรับ Live Streaming
  whisper-live:
    image: kksenateacr.azurecr.io/kk-transcription-whisper:alpha-dev
    container_name: transcription-whisper-live-staging
    ports:
      - "8003:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - WHISPER_MODEL_PATH=/app/models
      - ENVIRONMENT=staging
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '1.0'

volumes:
  redis_data_staging:
  rabbitmq_data_staging:

networks:
  app-network:
    driver: bridge