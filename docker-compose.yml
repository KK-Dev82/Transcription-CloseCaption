services:
  # Main API Service
  api:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    platform: linux/amd64
    container_name: transcription-api
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
      - ./test-files:/app/test-files
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 10.200.22.61
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis (local container)
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # ปรับ resources ให้พอดีกับ server (4 cores, 7.75GB RAM)
          # Total: 6.5G RAM, 3.6 CPU (เหลือ 1.25G RAM, 0.4 CPU สำหรับ OS)
          memory: 1G  # API ไม่ต้องการ memory มาก
          cpus: '0.6'  # API ไม่ต้องการ CPU มาก

  # Video Processing Worker 1
  video-worker-1:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    platform: linux/amd64
    container_name: video-worker-1
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 10.200.22.61
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis (local container)
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # ใช้ 2 workers แต่เพิ่ม resources ให้มากกว่า (ดีกว่า 3 workers)
          # แต่ละ worker: 3G RAM, 1.2 CPU (เทียบเท่า Local 75%)
          # Total: 6G RAM, 2.4 CPU (2 workers)
          memory: 3G  # เพิ่มจาก 2G → 3G (เทียบเท่า Local 75%)
          cpus: '1.2'  # เพิ่มจาก 0.8 → 1.2 (เทียบเท่า Local 120%)

  # Video Processing Worker 2
  video-worker-2:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    platform: linux/amd64
    container_name: video-worker-2
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 10.200.22.61
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis (local container)
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # ใช้ 2 workers แต่เพิ่ม resources ให้มากกว่า (ดีกว่า 3 workers)
          # แต่ละ worker: 3G RAM, 1.2 CPU (เทียบเท่า Local 75%)
          # Total: 6G RAM, 2.4 CPU (2 workers)
          memory: 3G  # เพิ่มจาก 2G → 3G (เทียบเท่า Local 75%)
          cpus: '1.2'  # เพิ่มจาก 0.8 → 1.2 (เทียบเท่า Local 120%)

  # Video Processing Worker 3
  # ⚠️  ปิด worker ที่ 3 เพื่อให้ workers ที่เหลือมี resources มากกว่า
  #     ใช้ 2 workers แต่ละตัว: 3G RAM, 1.2 CPU (ดีกว่า 3 workers แต่ละตัว: 2G RAM, 0.8 CPU)
  #     เหตุผล: Transcription tasks ใช้ resources มาก → แต่ละ worker ควรมี resources เพียงพอ
  # video-worker-3:

  # Whisper.cpp สำหรับ transcription
  whisper:
    image: kksenateacr.azurecr.io/kk-transcription-whisper:alpha-dev
    platform: linux/amd64
    container_name: transcription-whisper
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      WHISPER_MODEL_PATH: /app/models
      ENVIRONMENT: staging
      WHISPER_THREADS: 4
      WHISPER_BATCH_SIZE: 32
      WHISPER_OPTIMIZE: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # ปรับ resources ให้พอดีกับ server (4 cores, 7.75GB RAM)
          # Total: 6.5G RAM, 3.6 CPU (เหลือ 1.25G RAM, 0.4 CPU สำหรับ OS)
          memory: 2G  # Whisper ต้องการ memory สำหรับ model
          cpus: '1.0'  # Whisper ต้องการ CPU สำหรับ transcription

  # Whisper สำหรับ Live Streaming
  # ⚠️  NOTE: whisper-live service ไม่ได้ถูกใช้งานจริง (ทุกที่ใช้ whisper:8002)
  #      ปิดไว้เพื่อประหยัด resources (6G RAM + 1 CPU core)
  #      ถ้าต้องการใช้ในอนาคต สามารถ uncomment ได้
  # whisper-live:
  #   image: kksenateacr.azurecr.io/kk-transcription-whisper:alpha-dev
  #   platform: linux/amd64
  #   container_name: transcription-whisper-live
  #   ports:
  #     - "8003:8002"
  #   volumes:
  #     - ./uploads:/app/audio
  #     - ./temp:/app/temp
  #     - ./models:/app/models
  #   environment:
  #     WHISPER_MODEL_PATH: /app/models
  #     ENVIRONMENT: staging
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 6G
  #         cpus: '1.0'
 
  # Redis สำหรับ caching และ queue
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: transcription-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          # ปรับ resources ให้พอดีกับ server (4 cores, 7.75GB RAM)
          # Total: 7.5G RAM, 4.0 CPU (พอดีกับ server)
          memory: 0.5G  # ลดจาก 1G → 0.5G (เพื่อให้ workers มี resources เพิ่มขึ้น)
          cpus: '0.1'  # ลดจาก 0.2 → 0.1 (เพื่อให้ workers มี CPU เพิ่มขึ้น)
 

  # ========================================
  # 🎬 RTMP/HLS Streaming Server
  # ⚠️ ต้อง load image ก่อน:
  #    docker load -i rtmp/rtmp-server-latest.tar.gz
  # ========================================
  nginx-rtmp:
    image: rtmp-server:latest
    container_name: nginx-rtmp
    platform: linux/amd64
    restart: always
    ports:
      - "1935:1935"   # RTMP Push (รับ stream จาก FFmpeg relay)
      - "8080:8080"   # HTTP/HLS (serve m3u8 และ ts files)
    volumes:
      # RTMP Nginx config
      - ./rtmp/nginx.conf:/etc/nginx/nginx.conf:ro
      # Statistics stylesheet
      - ./rtmp/stat.xsl:/opt/nginx-rtmp/html/stat.xsl:ro
      # Video files สำหรับ streaming (ถ้ามี)
      - ./rtmp/video:/root/video:ro
      # HLS output
      - rtmp-hls:/tmp/hls      
      # Web player สำหรับทดสอบ streaming
      # URL: https://stagingbms.senate.go.th/player/test-stream.html
      - ./rtmp/html/player:/usr/share/nginx/html/player:ro
    environment:
      - TZ=Asia/Bangkok
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/stat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


volumes:
  redis_data:
  rtmp-hls:
    driver: local