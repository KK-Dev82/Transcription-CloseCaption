version: '3.8'

services:
  # Main API Service
  api:
    build: .
    container_name: transcription-api
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Video Processing Worker
  video-worker:
    build: .
    container_name: video-worker
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      - rabbitmq
      - redis
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      replicas: 2

  # RabbitMQ สำหรับ message queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: transcription-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis สำหรับ caching และ queue
  redis:
    image: redis:7-alpine
    container_name: transcription-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx สำหรับ reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: transcription-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - production

  # PostgreSQL สำหรับ database (optional)
  postgres:
    image: postgres:15-alpine
    container_name: transcription-db
    environment:
      POSTGRES_DB: transcription_db
      POSTGRES_USER: transcription_user
      POSTGRES_PASSWORD: transcription_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  redis_data:
  postgres_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge 