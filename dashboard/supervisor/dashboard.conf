[program:transcription-dashboard]
command=/bin/bash -c 'source /workspace/transcription-service/dashboard/venv/bin/activate && python3 -m uvicorn main:app --host 0.0.0.0 --port 8020'
directory=/workspace/transcription-service/dashboard
user=root
autostart=true
autorestart=true
startretries=3
stderr_logfile=/workspace/transcription-service/dashboard/logs/dashboard_error.log
stdout_logfile=/workspace/transcription-service/dashboard/logs/dashboard.log
environment=PYTHONPATH="/workspace/transcription-service",DASHBOARD_PORT="8020"
