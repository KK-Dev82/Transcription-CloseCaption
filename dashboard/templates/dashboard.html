<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Monitor</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:16px;font-size:14px;line-height:1.4}
        .header{margin-bottom:20px}
        .header h1{font-size:22px;font-weight:600}
        .header p{color:#86868b;font-size:13px;margin-top:4px}
        .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid #d2d2d7;padding-bottom:8px}
        .tab-btn{padding:8px 16px;background:0;border:0;cursor:pointer;font-size:14px;color:#86868b;border-radius:6px}
        .tab-btn:hover{color:#1d1d1f;background:#e8e8ed}
        .tab-btn.active{color:#0071e3;font-weight:600;background:#e8f4fc}
        .tab{display:none}
        .tab.active{display:block}
        .card{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
        .card h3{font-size:14px;font-weight:600;margin-bottom:12px;color:#1d1d1f}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
        .stat{padding:12px;background:#f5f5f7;border-radius:8px;text-align:center}
        .stat .val{font-size:20px;font-weight:600;color:#1d1d1f}
        .stat .lbl{font-size:11px;color:#86868b;margin-top:4px;text-transform:uppercase}
        .stat.ok .val{color:#34c759}
        .stat.warn .val{color:#ff9500}
        .stat.err .val{color:#ff3b30}
        .btn{padding:8px 14px;border:0;border-radius:8px;font-size:13px;cursor:pointer;background:#0071e3;color:#fff}
        .btn:hover{background:#0077ed}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .log-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
        .log-tab{padding:6px 12px;background:#f5f5f7;border:0;cursor:pointer;font-size:12px;border-radius:6px;color:#86868b}
        .log-tab:hover,.log-tab.active{background:#0071e3;color:#fff}
        .log-view{background:#1d1d1f;color:#e8e8ed;padding:12px;border-radius:8px;font-family:monospace;font-size:12px;line-height:1.5;max-height:400px;overflow-y:auto;white-space:pre-wrap}
        .bar{height:6px;background:#e8e8ed;border-radius:3px;overflow:hidden;margin-top:4px}
        .bar-fill{height:100%;background:#0071e3;border-radius:3px}
        .bar-fill.warn{background:#ff9500}
        .bar-fill.err{background:#ff3b30}
        .loading{text-align:center;padding:24px;color:#86868b}
        .err-msg{color:#ff3b30;font-size:13px;padding:12px;background:#fff3f3;border-radius:8px}
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard · Monitor</h1>
        <p>ตรวจสอบ Resource · ไม่มี auto-refresh (กด Refresh เอง)</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('status')" id="tab-status">Status</button>
        <button class="tab-btn" onclick="switchTab('logs')" id="tab-logs">Logs</button>
    </div>

    <div id="tab-status" class="tab active">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <h3>Health & Resources</h3>
                <button class="btn" onclick="refreshStatus()" id="statusRefresh">Refresh</button>
            </div>
            <div id="statusContent" class="loading">โหลด...</div>
        </div>
    </div>

    <div id="tab-logs" class="tab">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
                <h3>Logs</h3>
                <div style="display:flex;gap:8px;align-items:center">
                    <select id="logLines" onchange="loadLog()" style="padding:6px 10px;border:1px solid #d2d2d7;border-radius:6px;font-size:13px">
                        <option value="50">50 บรรทัด</option>
                        <option value="100" selected>100 บรรทัด</option>
                        <option value="200">200 บรรทัด</option>
                    </select>
                    <button class="btn" onclick="loadLog()" id="logRefresh">Refresh</button>
                </div>
            </div>
            <div class="log-tabs" id="logTabs"></div>
            <div id="logContent" class="log-view">เลือก log ด้านบน</div>
        </div>
    </div>

    <script>
        const API = '/api/monitor';
        let logList = [];
        let currentLog = '';

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
            document.getElementById('tab-'+name).classList.add('active');
            document.getElementById('tab-status').classList.toggle('active', name==='status');
            document.getElementById('tab-logs').classList.toggle('active', name==='logs');
            document.querySelector('.tab-btn[onclick*="'+name+'"]').classList.add('active');
            if(name==='status') refreshStatus();
            if(name==='logs' && logList.length===0) loadLogList();
        }

        function fetchWithTimeout(url, ms){
            const c = new AbortController();
            const t = setTimeout(()=>c.abort(), ms);
            return fetch(url, {signal:c.signal}).finally(()=>clearTimeout(t));
        }
        async function refreshStatus() {
            const el = document.getElementById('statusContent');
            const btn = document.getElementById('statusRefresh');
            btn.disabled = true;
            el.innerHTML = '<div class="loading">โหลด...</div>';
            try {
                const [health, system] = await Promise.all([
                    fetchWithTimeout(API+'/health', 6000).then(r=>r.json()).catch(()=>({status:'error',detail:'Timeout/Connection'})),
                    fetchWithTimeout(API+'/system', 8000).then(r=>r.ok?r.json():r.json().then(d=>({error:d.detail||'Error'}))).catch(()=>({error:'Main API (8010) ไม่ทำงาน'}))
                ]);
                let html = '';
                html += '<div class="grid">';
                html += '<div class="stat '+(health.status==='ok'?'ok':'err')+'"><div class="val">'+(health.status||'?')+'</div><div class="lbl">Health</div></div>';
                if(system.cpu_percent!=null){
                    const cpuClass = system.cpu_percent>80?'err':system.cpu_percent>60?'warn':'ok';
                    html += '<div class="stat '+cpuClass+'"><div class="val">'+Math.round(system.cpu_percent)+'%</div><div class="lbl">CPU</div></div>';
                }
                if(system.memory_percent!=null){
                    const memClass = system.memory_percent>85?'err':system.memory_percent>70?'warn':'ok';
                    html += '<div class="stat '+memClass+'"><div class="val">'+Math.round(system.memory_percent)+'%</div><div class="lbl">RAM</div></div>';
                }
                if(system.memory_used_gb!=null) html += '<div class="stat"><div class="val">'+(system.memory_used_gb||0).toFixed(1)+'</div><div class="lbl">GB ใช้</div></div>';
                if(system.gpu_utilization && system.gpu_utilization.length){
                    system.gpu_utilization.forEach((g,i)=>{
                        const gpuClass = (g.utilization_gpu_percent||0)>80?'err':(g.utilization_gpu_percent||0)>60?'warn':'ok';
                        html += '<div class="stat '+gpuClass+'"><div class="val">GPU'+i+' '+(g.utilization_gpu_percent||0)+'%</div><div class="lbl">'+(g.memory_used_mb||0)+'/'+(g.memory_total_mb||0)+' MB</div></div>';
                    });
                }
                html += '</div>';
                if(system.memory_percent!=null) html += '<div class="bar"><div class="bar-fill '+(system.memory_percent>85?'err':system.memory_percent>70?'warn':'')+'" style="width:'+system.memory_percent+'%"></div></div><small style="color:#86868b">RAM</small>';
                if(system.error) html = '<div class="err-msg">'+escapeHtml(system.error)+'<br><small>ตรวจสอบว่า Main API (port 8010) ทำงานอยู่</small></div>';
                if(health.status==='error' && health.detail) html += '<div class="err-msg" style="margin-top:8px">Health: '+escapeHtml(health.detail)+'</div>';
                el.innerHTML = html;
            } catch(e) {
                el.innerHTML = '<div class="err-msg">Error: '+e.message+'</div>';
            }
            btn.disabled = false;
        }

        async function loadLogList() {
            try {
                const r = await fetchWithTimeout(API+'/logs', 6000);
                const d = await r.json();
                logList = (d.available_logs||[]).map(l=>l.name);
                const labels = {'api':'FE CC','gpu0':'GPU0','gpu1':'GPU1','cpu0':'CPU0','cpu1':'CPU1','whisper':'Transcription','video-worker':'Video'};
                const order = ['api','gpu0','gpu1','cpu0','cpu1','preprocess0','preprocess1','whisper','video-worker'];
                const seen = new Set();
                let tabs = '';
                order.forEach(k=>{
                    if(logList.includes(k)) { seen.add(k); tabs += '<button class="log-tab'+(currentLog===k?' active':'')+'" data-log="'+k+'" onclick="selectLog(\''+k+'\')">'+(labels[k]||k)+'</button>'; }
                });
                logList.forEach(n=>{
                    if(!seen.has(n)) tabs += '<button class="log-tab'+(currentLog===n?' active':'')+'" data-log="'+n+'" onclick="selectLog(\''+n+'\')">'+n+'</button>';
                });
                document.getElementById('logTabs').innerHTML = tabs||'<span style="color:#86868b">ไม่มี log</span>';
                if(logList.length && !currentLog) selectLog(logList[0]);
            } catch(e) {
                document.getElementById('logTabs').innerHTML = '<span class="err-msg">Error: '+e.message+'</span>';
            }
        }

        function selectLog(name) {
            currentLog = name;
            document.querySelectorAll('.log-tab').forEach(t=>{
                t.classList.toggle('active', t.getAttribute('data-log')===name);
            });
            loadLog();
        }

        async function loadLog() {
            if(!currentLog) return;
            const el = document.getElementById('logContent');
            el.innerHTML = '<div class="loading">โหลด...</div>';
            try {
                const lines = document.getElementById('logLines').value;
                const r = await fetchWithTimeout(API+'/logs/'+currentLog+'?lines='+lines+'&tail=true', 10000);
                const d = await r.json();
                el.innerHTML = (d.lines||[]).map(l=>escapeHtml(l)).join('\n') || '(ว่าง)';
            } catch(e) {
                el.innerHTML = '<span class="err-msg">Error: '+e.message+'</span>';
            }
        }

        function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        document.addEventListener('DOMContentLoaded', ()=>{
            refreshStatus();
        });
    </script>
</body>
</html>
