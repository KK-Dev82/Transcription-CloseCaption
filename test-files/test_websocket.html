<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .processing { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>🧪 WebSocket Test</h1>
    <div id="status" class="status disconnected">🔴 Disconnected</div>
    <div style="margin: 20px 0;">
        <button onclick="startTestTranscription()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
            🚀 เริ่มทดสอบ Transcription
        </button>
        <button onclick="clearLogs()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;">
            🗑️ ล้าง Logs
        </button>
    </div>
    <div id="logs"></div>
    
    <script>
        const statusEl = document.getElementById('status');
        const logsEl = document.getElementById('logs');
        const userId = 'test_user_' + Math.random().toString(36).substr(2, 9);
        let taskId = null; // Will be set when starting transcription
        
        function log(message) {
            const logEl = document.createElement('div');
            logEl.className = 'log';
            logEl.textContent = `${new Date().toLocaleTimeString()} - ${message}`;
            logsEl.appendChild(logEl);
            logsEl.scrollTop = logsEl.scrollHeight;
            console.log(message);
        }
        
        function updateStatus(message, className) {
            statusEl.textContent = message;
            statusEl.className = `status ${className}`;
        }
        
        // WebSocket URL - Support local file, local server, and staging
        const isLocalFile = window.location.protocol === 'file:';
        const isStaging = window.location.hostname.includes('staging') || window.location.hostname.includes('senate.go.th');
        
        let wsUrl;
        if (isLocalFile) {
            // When opening from local file, default to localhost
            wsUrl = `ws://localhost:8001/ws/transcription/${userId}`;
            log('📁 Opening from local file - using localhost:8001');
        } else if (isStaging) {
            wsUrl = `wss://staging-ph2.bms.senate.go.th/transcribe/ws/transcription/${userId}`;
        } else {
            wsUrl = `ws://localhost:8001/ws/transcription/${userId}`;
        }
        
        log(`Connecting to: ${wsUrl}`);
        
        const ws = new WebSocket(wsUrl);
        
        ws.onopen = () => {
            log('✅ WebSocket Connected!');
            updateStatus('🟢 Connected', 'connected');
            
            // Subscribe to task
            ws.send(JSON.stringify({
                type: 'subscribe',
                task_id: taskId
            }));
            log(`📝 Subscribed to task: ${taskId}`);
        };
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            log(`📨 Received: ${JSON.stringify(data, null, 2)}`);
            
            if (data.type === 'ping') {
                ws.send(JSON.stringify({
                    type: 'pong',
                    timestamp: data.timestamp
                }));
                log('🏓 Sent pong response');
            }
            
            if (data.task_id === taskId) {
                if (data.status === 'completed') {
                    updateStatus('✅ Task Completed!', 'connected');
                } else if (data.status === 'failed') {
                    updateStatus('❌ Task Failed', 'disconnected');
                } else if (data.status === 'processing') {
                    updateStatus(`⏳ Processing... ${data.progress || 0}%`, 'processing');
                }
            }
        };
        
        ws.onclose = (event) => {
            log(`🔴 WebSocket Closed: ${event.code} - ${event.reason}`);
            updateStatus('🔴 Disconnected', 'disconnected');
        };
        
        ws.onerror = (error) => {
            log(`❌ WebSocket Error: ${error}`);
            updateStatus('❌ Error', 'disconnected');
        };
        
        // Test polling as fallback
        setInterval(async () => {
            if (!taskId) return; // Skip if no task ID
            
            try {
                // Determine API base based on environment
                let apiBase;
                if (isLocalFile) {
                    apiBase = 'http://localhost:8001';
                } else if (isStaging) {
                    apiBase = 'https://staging-ph2.bms.senate.go.th/transcribe';
                } else {
                    apiBase = 'http://localhost:8001';
                }
                
                const response = await fetch(`${apiBase}/polling/task/${taskId}`);
                const data = await response.json();
                log(`🔄 Polling: ${data.status} - ${data.progress || 0}%`);
                
                if (data.status === 'completed') {
                    updateStatus('✅ Task Completed!', 'connected');
                } else if (data.status === 'failed') {
                    updateStatus('❌ Task Failed', 'disconnected');
                }
            } catch (error) {
                log(`❌ Polling failed: ${error.message}`);
            }
        }, 5000);

        // Function to start test transcription
        async function startTestTranscription() {
            try {
                log('🚀 เริ่มทดสอบ Transcription...');
                
                // 1. Upload test file
                const formData = new FormData();
                const testFile = new File(['test audio content'], 'test.mp4', { type: 'video/mp4' });
                formData.append('file', testFile);
                
                // Determine API base based on environment
                let apiBase;
                if (isLocalFile) {
                    apiBase = 'http://localhost:8001';
                } else if (isStaging) {
                    apiBase = 'https://staging-ph2.bms.senate.go.th/transcribe';
                } else {
                    apiBase = 'http://localhost:8001';
                }
                
                const uploadResponse = await fetch(`${apiBase}/upload/`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!uploadResponse.ok) {
                    throw new Error(`Upload failed: ${uploadResponse.status}`);
                }
                
                const uploadResult = await uploadResponse.json();
                log(`✅ Upload successful: ${uploadResult.file_id}`);
                
                // 2. Start transcription
                const transcribeResponse = await fetch(`${apiBase}/transcribe-enhanced/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        file_path: uploadResult.file_path,
                        language: 'th',
                        model_size: 'base'
                    })
                });
                
                if (!transcribeResponse.ok) {
                    throw new Error(`Transcription failed: ${transcribeResponse.status}`);
                }
                
                const transcribeResult = await transcribeResponse.json();
                taskId = transcribeResult.task_id;
                
                log(`✅ Transcription started: ${taskId}`);
                updateStatus('⏳ Processing...', 'processing');
                
                // Subscribe to WebSocket updates
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'subscribe',
                        task_id: taskId
                    }));
                    log('📝 Subscribed to WebSocket updates');
                }
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                updateStatus('❌ Error', 'disconnected');
            }
        }

        // Function to clear logs
        function clearLogs() {
            logsEl.innerHTML = '';
            log('🧹 Logs cleared');
        }
    </script>
</body>
</html>
