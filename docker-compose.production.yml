services:
  # Main API Service
  api:
    image: kksenateacr.azurecr.io/kk-transcription:production
    container_name: transcription-api
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
      - ./test-files:/app/test-files
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      # Backend Server (10.200.22.61)
      - RABBITMQ_HOST=10.200.22.61
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=senate
      - RABBITMQ_PASSWORD=qP2VtHz6fAX4xDksEpMrLT
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'

  # Video Processing Worker 1
  video-worker-1:
    image: kksenateacr.azurecr.io/kk-transcription:production
    container_name: video-worker-1
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      # Backend Server (10.200.22.61)
      - RABBITMQ_HOST=10.200.22.61
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=senate
      - RABBITMQ_PASSWORD=qP2VtHz6fAX4xDksEpMrLT
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Video Processing Worker 2
  video-worker-2:
    image: kksenateacr.azurecr.io/kk-transcription:production
    container_name: video-worker-2
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      # Backend Server (10.200.22.61)
      - RABBITMQ_HOST=10.200.22.61
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=senate
      - RABBITMQ_PASSWORD=qP2VtHz6fAX4xDksEpMrLT
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Video Processing Worker 3
  video-worker-3:
    image: kksenateacr.azurecr.io/kk-transcription:production
    container_name: video-worker-3
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - STORAGE_TYPE=json
      - JSON_STORAGE_DIR=/app/storage
      # Backend Server (10.200.22.61)
      - RABBITMQ_HOST=10.200.22.61
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=senate
      - RABBITMQ_PASSWORD=qP2VtHz6fAX4xDksEpMrLT
      - WHISPER_API_URL=http://whisper:8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Redis สำหรับ caching และ queue
  redis:
    image: redis:7-alpine
    container_name: transcription-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.5'

  # Whisper.cpp สำหรับ transcription
  whisper:
    image: kksenateacr.azurecr.io/whisper-arm64:production
    container_name: transcription-whisper
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - WHISPER_MODEL_PATH=/app/models
      - ENVIRONMENT=production
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'

  # Whisper สำหรับ Live Streaming
  whisper-live:
    image: kksenateacr.azurecr.io/whisper-arm64:production
    container_name: transcription-whisper-live
    ports:
      - "8003:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      - WHISPER_MODEL_PATH=/app/models
      - ENVIRONMENT=production
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '1.0'

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
