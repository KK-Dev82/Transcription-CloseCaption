services:
  # Main API Service
  api:
    build: .
    container_name: transcription-api-dev
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
      - .:/app  # Mount source code for development
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Video Processing Worker 1
  video-worker-1:
    build: .
    container_name: video-worker-1-dev
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
      - .:/app  # Mount source code for development
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      - rabbitmq
      - redis
    networks:
      - app-network
    restart: unless-stopped

  # Video Processing Worker 2
  video-worker-2:
    build: .
    container_name: video-worker-2-dev
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
      - .:/app  # Mount source code for development
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin123
    depends_on:
      - rabbitmq
      - redis
    networks:
      - app-network
    restart: unless-stopped

  # RabbitMQ สำหรับ message queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: transcription-rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis สำหรับ caching และ queue
  redis:
    image: redis:7-alpine
    container_name: transcription-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Whisper.cpp สำหรับ transcription (Development)
  whisper:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    container_name: transcription-whisper-dev
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp  # Mount temp directory เพื่อให้เข้าถึง audio chunks จาก API
      - ./models:/app/models
    environment:
      - WHISPER_MODEL_PATH=/app/models
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data_dev:
  rabbitmq_data_dev:

networks:
  app-network:
    driver: bridge 