# Nginx RTMP Configuration
# สำหรับรับ RTMP stream และแปลงเป็น HLS

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        allow publish all;
        allow play all;

        # Application สำหรับรับ RTMP stream
        application live {
            live on;
            
            # ปิดการบันทึก (ใช้เฉพาะ relay)
            record off;
            
            # HLS output สำหรับ clean stream (โดยตรง)
            hls on;
            hls_path /tmp/hls/clean;
            hls_fragment 3s;
            hls_playlist_length 30s;
            hls_continuous on;
            hls_cleanup on;
            hls_nested on;
            
            # Notify script สำหรับเริ่ม transcription
            on_publish http://localhost:8010/api/rtmp/on_publish;
            on_publish_done http://localhost:8010/api/rtmp/on_publish_done;
        }
        
        # Application สำหรับ clean stream relay (ถ้าต้องการ relay แยก)
        application clean {
            live on;
            allow publish 127.0.0.1;
            allow play all;
            
            # HLS output
            hls on;
            hls_path /tmp/hls/clean;
            hls_fragment 3s;
            hls_playlist_length 30s;
            hls_continuous on;
            hls_cleanup on;
        }
        
        # Application สำหรับ CC stream (burn-in) - จะถูก push จาก FFmpeg
        application cc {
            live on;
            allow publish 127.0.0.1;
            allow play all;
            
            # HLS output
            hls on;
            hls_path /tmp/hls/cc;
            hls_fragment 3s;
            hls_playlist_length 30s;
            hls_continuous on;
            hls_cleanup on;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /var/log/nginx/access.log;
    
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    
    server {
        listen 8080;
        server_name localhost;
        
        # HLS Playlist และ Segments
        location /hls/ {
            alias /tmp/hls/;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers 'Range';
            
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }
        
        # RTMP Statistics
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }
        
        location /stat.xsl {
            root /usr/share/nginx/html;
        }
        
        # Health check
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}

