# ============================================================================
# Production Docker Compose: Self-Hosted Server
# Server: CPU 14, RAM 30GB, 2x NVIDIA RTX PRO 4000 (24GB VRAM each)
#
# ใช้งาน:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
# Image ต้อง load ก่อน (ถ้ายังไม่ได้ pull จาก ACR):
#   docker load -i kk-transcription-release-v1.0.0.tar.gz
# หรือ pull จาก ACR:
#   az acr login --name kksenateacr
#   docker pull kksenateacr.azurecr.io/kk-transcription:release-v1.0.0
# ============================================================================

services:
  # ============================================================================
  # Transcription Service (All-in-One: API + Whisper + RQ Workers)
  # start-pod.sh  → Main API (8010) + Whisper API (8002) + Video Worker
  # start-rq-workers.sh → GPU workers (per GPU) + Preprocess + CPU workers
  # ============================================================================
  transcription:
    image: kksenateacr.azurecr.io/kk-transcription:release-v1.0.0
    container_name: transcription-service
    ports:
      - "8010:8010"   # Main API (FastAPI)
      - "8002:8002"   # Whisper API (faster-whisper)
    volumes:
      # Data ที่ต้อง persist (หายไม่ได้)
      - ./uploads:/workspace/transcription-service/uploads
      - ./storage:/workspace/transcription-service/storage
      - ./models:/workspace/transcription-service/models
      # ไฟล์ชั่วคราว + logs (หายได้ แต่ mount ไว้ debug ง่าย)
      - ./temp:/workspace/transcription-service/temp
      # Environment config (mount จาก host เพื่อแก้ไขได้โดยไม่ต้อง rebuild)
      - ./.env.runpod:/workspace/transcription-service/.env.runpod:ro
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s   # นานกว่าปกติ เพราะต้อง start หลาย services + load models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all       # ใช้ GPU ทั้ง 2 ตัว
              capabilities: [gpu]
        limits:
          memory: 28G          # เหลือ 2G สำหรับ OS + Redis
          cpus: '13'           # เหลือ 1 core สำหรับ OS + Redis

  # ============================================================================
  # Redis สำหรับ RQ job queue + caching
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: transcription-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1'

volumes:
  redis_data:
