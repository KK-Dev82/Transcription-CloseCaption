# ============================================================================
# Production Docker Compose: Self-Hosted GPU Server (10.200.22.64)
# CPU 14, RAM 30GB, 2x NVIDIA RTX PRO 4000 (24GB VRAM each)
#
# Images:
#   kk-base:ubuntu2404-cuda128-torch280  → OS + CUDA + dependencies (10.8 GB, build นานๆ ครั้ง)
#   kk-transcription:latest              → Application code (~3 MB, build เร็ว)
#
# Setup:
#   docker compose -f docker-compose.prod.yml up -d
#
# Update code:
#   1. Build image ใหม่ (บน Mac หรือ CI/CD)
#   2. docker compose -f docker-compose.prod.yml pull transcription
#   3. docker compose -f docker-compose.prod.yml up -d
# ============================================================================

services:
  # ============================================================================
  # Transcription Service (API + Whisper + RQ Workers)
  # ============================================================================
  transcription:
    image: kksenateacr.azurecr.io/kk-transcription:latest
    container_name: transcription-service
    ports:
      - "8010:8010"
      - "8002:8002"
    volumes:
      # Data volumes (persist ข้าม container restart)
      - ./uploads:/workspace/transcription-service/uploads
      - ./storage:/workspace/transcription-service/storage
      - ./models:/workspace/transcription-service/models
      - ./temp:/workspace/transcription-service/temp
      # Environment config
      - ./.env.runpod:/workspace/transcription-service/.env.runpod:ro
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 28G
          cpus: '13'

  # ============================================================================
  # Redis (RQ job queue + caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: transcription-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1'

volumes:
  redis_data:
