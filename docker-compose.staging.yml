services:
  # Main API Service
  api:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: transcription-api
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
      - ./test-files:/app/test-files
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 178.128.105.100
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis Pub/Sub (VM 47) - สำหรับ WebSocket notification
      REDIS_URL: redis://10.200.22.61:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2.0'

  # Video Processing Worker 1
  video-worker-1:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: video-worker-1
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 178.128.105.100
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis Pub/Sub (VM 47)
      REDIS_URL: redis://10.200.22.61:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Video Processing Worker 2
  video-worker-2:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: video-worker-2
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 10.200.22.61
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis Pub/Sub (VM 47)
      REDIS_URL: redis://10.200.22.61:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Video Processing Worker 3
  video-worker-3:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    container_name: video-worker-3
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 178.128.105.100
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis Pub/Sub (VM 47)
      REDIS_URL: redis://10.200.22.61:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'

  # Whisper.cpp สำหรับ transcription
  whisper:
    image: kksenateacr.azurecr.io/kk-transcription-whisper:alpha-dev
    container_name: transcription-whisper
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      WHISPER_MODEL_PATH: /app/models
      ENVIRONMENT: staging
      WHISPER_THREADS: 4
      WHISPER_BATCH_SIZE: 32
      WHISPER_OPTIMIZE: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'

  # Whisper สำหรับ Live Streaming
  whisper-live:
    image: kksenateacr.azurecr.io/kk-transcription-whisper:alpha-dev
    container_name: transcription-whisper-live
    ports:
      - "8003:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      WHISPER_MODEL_PATH: /app/models
      ENVIRONMENT: staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '1.0'
