  #     - ./temp:/app/temp
  #     - ./models:/app/models
  #   environment:
  #     PYTHONPATH: /app
  #     ENVIRONMENT: staging
  #     STORAGE_TYPE: json
  #     JSON_STORAGE_DIR: /app/storage
  #     # RabbitMQ (VM 47)
  #     RABBITMQ_HOST: 10.200.22.61
  #     RABBITMQ_PORT: 5672
  #     RABBITMQ_USER: senate
  #     RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
  #     # Whisper (same VM)
  #     WHISPER_API_URL: http://whisper:8002
  #     # Redis (local container)
  #     REDIS_URL: redis://redis:6379
  #   restart: unless-stopped
  #   depends_on:
  #     - redis
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
  #     interval: 60s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   deploy:
  #     resources:
  #       limits:
  #         # Optimized for 4-core, 7.75GB RAM server (within 3.2 CPU, 6GB available)
  #         memory: 1G
  #         cpus: '0.4'

  # Whisper.cpp สำหรับ transcription
  whisper:
    image: kksenateacr.azurecr.io/kk-transcription-whisper:alpha-dev
    platform: linux/amd64
    container_name: transcription-whisper
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/audio
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      WHISPER_MODEL_PATH: /app/models
      ENVIRONMENT: staging
      WHISPER_THREADS: 4
      WHISPER_BATCH_SIZE: 32
      WHISPER_OPTIMIZE: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Optimized for 4-core, 7.75GB RAM server (within 3.2 CPU, 6GB available)
          # Total: 3.0 CPU, 5.5G RAM (within limits)
          memory: 1.5G
          cpus: '1.0'

  # Whisper สำหรับ Live Streaming
  # ⚠️  NOTE: whisper-live service ไม่ได้ถูกใช้งานจริง (ทุกที่ใช้ whisper:8002)
  #      ปิดไว้เพื่อประหยัด resources (6G RAM + 1 CPU core)
  #      ถ้าต้องการใช้ในอนาคต สามารถ uncomment ได้
  # whisper-live:
  #   image: kksenateacr.azurecr.io/kk-transcription-whisper:alpha-dev
  #   platform: linux/amd64
  #   container_name: transcription-whisper-live
  #   ports:
  #     - "8003:8002"
  #   volumes:
  #     - ./uploads:/app/audio
  #     - ./temp:/app/temp
  #     - ./models:/app/models
  #   environment:
  #     WHISPER_MODEL_PATH: /app/models
  #     ENVIRONMENT: staging
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 6G
  #         cpus: '1.0'
 
  # Redis สำหรับ caching และ queue
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    container_name: transcription-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          # Optimized for 4-core, 7.75GB RAM server (within 3.2 CPU, 6GB available)
          memory: 1G
          cpus: '0.2'
 
volumes:
  redis_data:
