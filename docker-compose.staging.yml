services:
  # Main API Service
  api:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    platform: linux/amd64
    container_name: transcription-api
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
      - ./test-files:/app/test-files
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 10.200.22.61
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis (local container)
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Optimized for 4-core, 7.75GB RAM server (within 3.2 CPU, 6GB available)
          # Total: 3.0 CPU, 5.5G RAM (within limits)
          memory: 1.5G
          cpus: '1.0'

  # Video Processing Worker 1
  video-worker-1:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    platform: linux/amd64
    container_name: video-worker-1
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 10.200.22.61
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis (local container)
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Optimized for 4-core, 7.75GB RAM server (within 3.2 CPU, 6GB available)
          memory: 1G
          cpus: '0.4'

  # Video Processing Worker 2
  video-worker-2:
    image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
    platform: linux/amd64
    container_name: video-worker-2
    command: python -m app.workers.video_worker
    volumes:
      - ./uploads:/app/uploads
      - ./storage:/app/storage
      - ./temp:/app/temp
      - ./models:/app/models
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: staging
      STORAGE_TYPE: json
      JSON_STORAGE_DIR: /app/storage
      # RabbitMQ (VM 47)
      RABBITMQ_HOST: 10.200.22.61
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: senate
      RABBITMQ_PASSWORD: qP2VtHz6fAX4xDksEpMrLT
      # Whisper (same VM)
      WHISPER_API_URL: http://whisper:8002
      # Redis (local container)
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Optimized for 4-core, 7.75GB RAM server (within 3.2 CPU, 6GB available)
          memory: 1G
          cpus: '0.4'

  # Video Processing Worker 3
  # ⚠️  NOTE: ปิด worker ที่ 3 เพื่อประหยัด resources (server มี 4 cores, 7.75GB RAM)
  #      ถ้าต้องการเพิ่ม throughput สามารถ uncomment ได้ แต่ต้องลด resources ของ service อื่น
  # video-worker-3:
  #   image: kksenateacr.azurecr.io/kk-transcription:alpha-dev
  #   platform: linux/amd64
  #   container_name: video-worker-3
  #   command: python -m app.workers.video_worker
  #   volumes:
  #     - ./uploads:/app/uploads
